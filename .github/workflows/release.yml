name: Windows portable release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Run regression checks
        run: python -m unittest discover -s tests -v
      - name: Build and verify standalone executable
        run: python tools/build_release.py
      - name: Save executable
        uses: actions/upload-artifact@v4
        with:
          name: AIUsage-Windows-x64
          path: |
            dist/AIUsage.exe
            dist/SHA256SUMS.txt
      - name: Publish downloadable release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" dist/AIUsage.exe dist/SHA256SUMS.txt --verify-tag --title "AI 用量桌面宠物 $env:GITHUB_REF_NAME" --notes-file packaging/release-notes.md
